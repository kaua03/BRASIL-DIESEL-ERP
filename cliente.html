<div class="h-full flex flex-col anima-fade">
    <!-- Cabeçalho da Página -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-black text-[#1a428a] dark:text-white">Central de Clientes</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Gestão completa do cadastro de clientes da oficina.</p>
        </div>
        <button onclick="window.abrirModalCliente()" class="bg-[#1a428a] hover:bg-blue-900 dark:bg-[#2563eb] dark:hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md transition-all flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Novo Cliente
        </button>
    </div>

    <!-- Barra de Pesquisa -->
    <div class="bg-white dark:bg-[#1e293b] p-4 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm mb-6 flex gap-4 items-center transition-colors">
        <div class="relative flex-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="filtro-cliente" oninput="window.filtrarClientes(this.value)" placeholder="Pesquisar por nome, telefone ou documento..." class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-[#0f172a] border border-gray-200 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#1a428a] dark:focus:border-[#3b82f6] text-gray-800 dark:text-white transition-colors">
        </div>
    </div>

    <!-- Tabela / Lista de Clientes -->
    <div class="bg-white dark:bg-[#1e293b] rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm flex-1 overflow-hidden flex flex-col transition-colors">
        <div class="overflow-y-auto flex-1 custom-scrollbar">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 dark:bg-[#0f172a]/50 text-gray-400 dark:text-gray-400 uppercase text-[10px] font-black tracking-wider sticky top-0 border-b border-gray-200 dark:border-gray-700">
                    <tr>
                        <th class="p-4">Cliente / Razão Social</th>
                        <th class="p-4">Telefone</th>
                        <th class="p-4">CPF / CNPJ</th>
                        <th class="p-4">Endereço</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-clientes" class="divide-y divide-gray-100 dark:divide-gray-800 text-sm">
                    <!-- Injetado via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE CLIENTE -->
    <div id="modal-cliente" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[250] hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-[#1e293b] rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-gray-200 dark:border-gray-700 anima-fade">
            <div class="flex justify-between items-center mb-5 border-b border-gray-100 dark:border-gray-800 pb-3">
                <h3 id="modal-cliente-titulo" class="text-lg font-black text-[#1a428a] dark:text-[#3b82f6]">Registar Novo Cliente</h3>
                <button onclick="window.fecharModalCliente()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 font-bold text-lg">✕</button>
            </div>
            
            <form id="form-cliente" onsubmit="window.salvarCliente(event)" class="space-y-4">
                <input type="hidden" id="cliente-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase mb-1">Nome / Razão Social *</label>
                    <input type="text" id="cliente-nome" required class="w-full px-3 py-2 bg-gray-50 dark:bg-[#0f172a] border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#1a428a] dark:focus:border-[#3b82f6] text-gray-800 dark:text-white uppercase">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="cliente-telefone" class="w-full px-3 py-2 bg-gray-50 dark:bg-[#0f172a] border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#1a428a] dark:focus:border-[#3b82f6] text-gray-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase mb-1">CPF / CNPJ</label>
                        <input type="text" id="cliente-documento" class="w-full px-3 py-2 bg-gray-50 dark:bg-[#0f172a] border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#1a428a] dark:focus:border-[#3b82f6] text-gray-800 dark:text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase mb-1">Endereço</label>
                    <input type="text" id="cliente-endereco" class="w-full px-3 py-2 bg-gray-50 dark:bg-[#0f172a] border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#1a428a] dark:focus:border-[#3b82f6] text-gray-800 dark:text-white uppercase">
                </div>

                <div class="flex justify-end gap-3 pt-3 border-t border-gray-100 dark:border-gray-800">
                    <button type="button" onclick="window.fecharModalCliente()" class="px-4 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition-colors">Cancelar</button>
                    <button type="submit" class="px-5 py-2 text-xs font-bold bg-[#1a428a] hover:bg-blue-900 dark:bg-[#2563eb] text-white rounded-xl shadow-md transition-colors">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
