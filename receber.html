<!-- views/nav/receber.html -->
<div class="fade-in space-y-6 flex flex-col h-full text-sm">
    
    <!-- Cards Superiores (Resumo) -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 shrink-0">
        <div class="bg-white dark:bg-[#1e293b] p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 md:col-span-2 flex flex-col justify-center transition-all duration-150">
            <h2 class="text-3xl font-black text-[#1a428a] dark:text-[#3b82f6]">Contas a Receber</h2>
            <p class="text-gray-500 dark:text-gray-400 font-medium mt-1">Gestão de entradas, recebimentos e faturamento de O.S.</p>
        </div>
        
        <div class="bg-amber-50 dark:bg-amber-900/10 p-5 rounded-2xl border border-amber-200 dark:border-amber-800/30 flex flex-col justify-between transition-all duration-150 shadow-sm">
            <span class="text-xs font-black text-amber-700 dark:text-amber-500 uppercase tracking-widest">Total Pendente</span>
            <span id="card-total-pendente" class="text-2xl font-black font-mono text-amber-600 dark:text-amber-400 mt-2">R$ 0,00</span>
        </div>

        <div class="bg-emerald-50 dark:bg-emerald-900/10 p-5 rounded-2xl border border-emerald-200 dark:border-emerald-800/30 flex flex-col justify-between transition-all duration-150 shadow-sm">
            <span class="text-xs font-black text-emerald-700 dark:text-emerald-500 uppercase tracking-widest">Total Recebido</span>
            <span id="card-total-recebido" class="text-2xl font-black font-mono text-emerald-600 dark:text-emerald-400 mt-2">R$ 0,00</span>
        </div>
    </div>

    <!-- Barra de Filtros, Abas e Exclusão em Massa -->
    <div class="bg-white dark:bg-[#1e293b] p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0 transition-all duration-150">
        
        <div class="flex flex-wrap items-center gap-4 w-full sm:w-auto">
            <div class="flex bg-gray-100 dark:bg-[#0f172a] p-1 rounded-xl w-full sm:w-auto border border-transparent dark:border-gray-800">
                <button onclick="window.mudarAbaReceber('Pendente')" id="btn-tab-pendente" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-wider transition-all duration-150 bg-[#1a428a] text-white shadow-sm">
                    Pendentes
                </button>
                <button onclick="window.mudarAbaReceber('Recebido')" id="btn-tab-recebido" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-wider transition-all duration-150 text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white">
                    Recebidas
                </button>
            </div>

            <!-- Botão de Exclusão em Massa (Aparece ao selecionar caixas individuais) -->
            <button type="button" id="btn-excluir-massa" onclick="window.excluirContasMassa()" class="hidden px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-150 shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                Excluir Selecionadas (<span id="qtd-selecionadas">0</span>)
            </button>
        </div>

        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
            <select id="filtro-conta-receber" onchange="window.renderizarReceber()" class="px-4 py-2.5 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#0f172a] dark:text-white rounded-xl outline-none font-bold text-xs transition-all duration-150 cursor-pointer focus:border-[#1a428a]">
                <option value="TODAS">Todas as Contas</option>
                <option value="Caixa Interno">Caixa Interno</option>
                <option value="Banco do Brasil">Banco do Brasil</option>
                <option value="Vale">Vale</option>
            </select>
            
            <input type="text" id="filtro-busca-receber" oninput="window.renderizarReceber()" class="w-full sm:w-64 px-4 py-2.5 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#0f172a] dark:text-white rounded-xl outline-none text-xs font-bold transition-all duration-150 focus:border-[#1a428a]" placeholder="Buscar Cliente, Placa ou O.S...">
        </div>
    </div>

    <!-- Área da Tabela -->
    <div class="flex-1 overflow-x-auto overflow-y-auto custom-scrollbar pb-8 relative">
        <div class="bg-white dark:bg-[#1e293b] rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden inline-block min-w-full align-middle h-fit transition-colors duration-150">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 text-xs font-black text-gray-600 dark:text-gray-300 uppercase tracking-wider">
                    <tr>
                        <th class="p-4 w-12 text-center border-r border-gray-200 dark:border-gray-700">
                            <!-- REMOVIDO CHECKBOX MESTRE AQUI (Proteção contra cliques acidentais) -->
                        </th>
                        <th class="p-4 text-center w-[10%]">Ref. O.S</th>
                        <th class="p-4 w-[25%]">Cliente</th>
                        <th class="p-4 text-center w-[10%]">Placa</th>
                        <th class="p-4 text-center w-[15%]">Vencimento</th>
                        <th class="p-4 text-center w-[15%]">Operação / Conta</th>
                        <th class="p-4 text-right w-[15%]">Valor</th>
                        <th class="p-4 text-center w-[10%]">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-dados-receber" class="transition-colors duration-150">
                    <tr>
                        <td colspan="8" class="text-center p-8 text-gray-400 font-bold italic">Sincronizando com o cofre...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ========================================================= -->
<!-- MODAL: EXCLUSÃO INTELIGENTE DE MÚLTIPLAS PARCELAS         -->
<!-- ========================================================= -->
<div id="modal-exclusao-inteligente" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[250] hidden items-center justify-center p-4 transition-opacity duration-150">
    <div class="bg-white dark:bg-[#1e293b] rounded-2xl shadow-2xl p-6 w-full max-w-md border-t-4 border-red-500 text-center flex flex-col anima-fade">
        <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-100 dark:bg-red-900/30 mb-4"><span class="text-2xl">⚠️</span></div>
        <h3 class="text-xl font-black text-gray-800 dark:text-white mb-2">Exclusão de Parcelas</h3>
        <p id="texto-exclusao-inteligente" class="text-sm text-gray-600 dark:text-gray-300 mb-6 leading-relaxed"></p>
        
        <div class="flex flex-col gap-3">
            <button onclick="window.escolherExclusaoInteligente('todas')" class="w-full px-5 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-md transition-colors duration-150 uppercase text-xs tracking-wider">Sim, excluir todas as parcelas</button>
            <button onclick="window.escolherExclusaoInteligente('unica')" class="w-full px-5 py-3 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-bold rounded-lg transition-colors duration-150 uppercase text-xs tracking-wider">Não, excluir somente a selecionada</button>
            <button onclick="document.getElementById('modal-exclusao-inteligente').classList.add('hidden'); document.getElementById('modal-exclusao-inteligente').classList.remove('flex');" class="w-full px-5 py-2 mt-2 text-gray-500 font-bold hover:text-gray-800 dark:hover:text-white transition-colors duration-150 text-xs uppercase underline">Cancelar e Voltar</button>
        </div>
    </div>
</div>

<!-- ========================================================= -->
<!-- MODAL: EDIÇÃO DIRETA NO BANCO DE DADOS                    -->
<!-- ========================================================= -->
<div id="modal-editar-receber" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[200] hidden items-center justify-center p-4 transition-opacity duration-150">
    <div class="bg-white dark:bg-[#0f172a] rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-200 dark:border-gray-700 flex flex-col anima-fade">
        <div class="bg-[#1a428a] dark:bg-[#081121] text-white p-4 flex justify-between items-center border-b border-gray-200 dark:border-gray-800">
            <h3 class="font-black tracking-widest uppercase text-sm">Editar Parcela</h3>
            <button onclick="document.getElementById('modal-editar-receber').classList.add('hidden'); document.getElementById('modal-editar-receber').classList.remove('flex');" class="text-blue-200 hover:text-white text-2xl leading-none transition-colors">&times;</button>
        </div>
        <form onsubmit="window.salvarEdicaoReceber(event)" class="p-5 space-y-4">
            <input type="hidden" id="edit-receber-id">
            
            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase mb-1">Vencimento</label>
                <input type="date" id="edit-receber-vencimento" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#1e293b] dark:text-white rounded-lg outline-none focus:border-[#1a428a] font-mono text-sm transition-colors">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase mb-1">Conta Destino</label>
                <select id="edit-receber-conta" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#1e293b] dark:text-white rounded-lg outline-none focus:border-[#1a428a] text-sm transition-colors">
                    <option value="Caixa Interno">Caixa Interno</option>
                    <option value="Banco do Brasil">Banco do Brasil</option>
                    <option value="Vale">Vale</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase mb-1">Operação Financeira</label>
                <select id="edit-receber-operacao" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#1e293b] dark:text-white rounded-lg outline-none focus:border-[#1a428a] text-sm transition-colors">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Boleto Bancário">Boleto Bancário</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase mb-1">Valor (R$)</label>
                    <input type="text" id="edit-receber-valor" required oninput="window.mascaraValorItem(this)" class="w-full px-3 py-2 border border-emerald-300 dark:border-emerald-700 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 rounded-lg outline-none focus:border-emerald-500 font-mono font-black text-right transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase mb-1">NSU / DOC</label>
                    <input type="text" id="edit-receber-nsu" placeholder="Opcional" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-[#1e293b] dark:text-white rounded-lg outline-none focus:border-[#1a428a] font-mono text-sm transition-colors">
                </div>
            </div>
            <button type="submit" class="w-full bg-[#1a428a] hover:bg-blue-900 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-black py-3 mt-2 rounded-xl shadow-md transition-all duration-150 uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                Salvar Alterações
            </button>
        </form>
    </div>
</div>
