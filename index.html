    <script>
        // MOTOR DO MODO NOTURNO
        window.alternarModoNoturno = function() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            
            if (html.classList.contains('dark')) {
                localStorage.setItem('tema', 'dark');
                if(window.mostrarToast) window.mostrarToast("Modo Noturno Ativado 🌙", "sucesso");
            } else {
                localStorage.setItem('tema', 'light');
                if(window.mostrarToast) window.mostrarToast("Modo Claro Ativado ☀️", "sucesso");
            }
        };

        // Verifica o tema salvo assim que carrega
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('tema') === 'dark') {
                document.documentElement.classList.add('dark');
            }

            if (window.configurarBotoesMenu) window.configurarBotoesMenu();
            
            const formLogin = document.getElementById('form-login');
            if (formLogin && window.tentarLogar) {
                formLogin.addEventListener('submit', window.tentarLogar);
            }
        });

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const textos = document.querySelectorAll('.sidebar-text');
            
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                textos.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                setTimeout(() => {
                    textos.forEach(el => el.classList.remove('hidden'));
                }, 150);
            }
        };
    </script>
</body>
</html>
