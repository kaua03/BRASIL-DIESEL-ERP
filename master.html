<!-- views/nav/master.html -->
<div class="fade-in space-y-6 flex flex-col h-full">
    <!-- Cabeçalho Principal -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-[#1e293b] p-6 rounded-2xl shadow-sm border border-red-200 dark:border-red-900/30 transition-colors duration-300 shrink-0">
        <div>
            <div class="flex items-center gap-3">
                <h2 class="text-3xl font-black text-red-700 dark:text-red-500 uppercase tracking-tight">Painel Master</h2>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 text-[10px] font-black tracking-widest uppercase border border-red-200 dark:border-red-800">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    Auditoria Ativa
                </span>
            </div>
            <p class="text-gray-500 dark:text-gray-400 font-medium mt-1">Centro de Comando: Monitoramento de acessos ao vivo, logs de segurança e atividades.</p>
        </div>
    </div>

    <!-- ÁREA 1: RADAR DE USUÁRIOS ONLINE (NOVIDADE) -->
    <div class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 transition-colors duration-300 shrink-0">
        <h3 class="font-black text-[#1a428a] dark:text-[#3b82f6] uppercase tracking-widest text-xs mb-4 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            Radar da Oficina (Em Tempo Real)
        </h3>
        
        <!-- A grelha onde as "bolinhas" vão aparecer -->
        <div id="radar-usuarios" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center p-6 text-gray-400 font-medium text-xs border border-dashed border-gray-300 dark:border-gray-600 rounded-xl">
                A rastrear utilizadores conectados...
            </div>
        </div>
    </div>

    <!-- ÁREA 2: TABELA DE LOGS HISTÓRICOS -->
    <div class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-300 flex-1 flex flex-col">
        <div class="p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-[#0f172a] flex justify-between items-center shrink-0">
            <h3 class="font-black text-[#1a428a] dark:text-[#3b82f6] uppercase tracking-widest text-xs">Registro de Atividades</h3>
            <button onclick="window.limparLogsAntigos()" class="text-[10px] bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 px-3 py-1.5 rounded font-bold uppercase tracking-wider transition-colors">Limpar Histórico (> 30 dias)</button>
        </div>
        
        <div class="overflow-y-auto custom-scrollbar flex-1 relative">
            <table class="w-full text-left border-collapse text-sm">
                <thead class="sticky top-0 z-10 bg-gray-50/90 dark:bg-[#0f172a]/90 backdrop-blur-sm">
                    <tr class="text-gray-500 dark:text-gray-400 text-[10px] uppercase tracking-widest border-b border-gray-200 dark:border-gray-800">
                        <th class="p-4 font-black w-32 md:w-40">Data / Hora</th>
                        <th class="p-4 font-black w-40 md:w-48">Utilizador</th>
                        <th class="p-4 font-black w-24 md:w-32">Módulo</th>
                        <th class="p-4 font-black">Ação / Detalhes</th>
                    </tr>
                </thead>
                <tbody id="tabela-logs" class="divide-y divide-gray-100 dark:divide-gray-800 transition-colors bg-white dark:bg-[#1e293b]">
                    <tr><td colspan="4" class="text-center p-12 text-gray-500 dark:text-gray-400 font-bold">A conectar às câmeras do sistema...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
