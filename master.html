<div class="fade-in space-y-6 flex flex-col h-full">
    <!-- Cabeçalho -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-[#1e293b] p-6 rounded-2xl shadow-sm border border-red-200 dark:border-red-900/30 transition-colors duration-300 shrink-0">
        <div>
            <div class="flex items-center gap-3">
                <h2 class="text-3xl font-black text-red-700 dark:text-red-500 uppercase tracking-tight">Painel Master</h2>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 text-[10px] font-black tracking-widest uppercase border border-red-200 dark:border-red-800">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    Auditoria Ativa
                </span>
            </div>
            <p class="text-gray-500 dark:text-gray-400 font-medium mt-1">Centro de Comando: Monitoramento de acessos, logs de segurança e atividades do sistema.</p>
        </div>
    </div>

    <!-- Tabela de Logs -->
    <div class="bg-white dark:bg-[#1e293b] rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-300 flex-1 flex flex-col">
        <div class="p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-[#0f172a] flex justify-between items-center">
            <h3 class="font-black text-[#1a428a] dark:text-[#3b82f6] uppercase tracking-widest text-xs">Registro de Atividades em Tempo Real</h3>
            <button onclick="window.limparLogsAntigos()" class="text-[10px] bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 px-3 py-1.5 rounded font-bold uppercase tracking-wider transition-colors">Limpar Histórico (> 30 dias)</button>
        </div>
        <div class="overflow-y-auto custom-scrollbar flex-1 p-0">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-50/50 dark:bg-[#0f172a]/50 text-gray-500 dark:text-gray-400 text-[10px] uppercase tracking-widest border-b border-gray-100 dark:border-gray-800 sticky top-0 z-10 backdrop-blur-sm">

                        <th class="p-4 font-black w-48">Utilizador</th>

                        <th class="p-4 font-black">Ação / Detalhes</th>
                    </tr>
                </thead>
                <tbody id="tabela-logs" class="divide-y divide-gray-100 dark:divide-gray-800 transition-colors">

                </tbody>
            </table>
